plugins {
    id 'com.android.application'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

def hasFirebaseConfig = file('google-services.json').exists()
def useFirebaseEmulators = (project.findProperty('useFirebaseEmulators') ?: 'false').toBoolean()

if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle(
            'Firebase configuration not found: app/google-services.json. ' +
            'The app will build with Firebase features disabled.'
    )
}

android {
    namespace 'com.propcycle.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.propcycle.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', useFirebaseEmulators.toString()
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

secrets {
    propertiesFileName = 'secrets.properties'
    defaultPropertiesFileName = 'local.defaults.properties'
    ignoreList.add('sdk.*')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.libraries.places:places:5.3.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    def cameraXVersion = '1.6.1'
    implementation "androidx.camera:camera-camera2:${cameraXVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    implementation "androidx.camera:camera-view:${cameraXVersion}"
    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    def lifecycleVersion = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel:${lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-livedata:${lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-common-java8:${lifecycleVersion}"

    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-ai'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'

    // Firebase AI Logic's Java one-shot API exposes Guava ListenableFuture.
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation 'junit:junit:4.13.2'
}
